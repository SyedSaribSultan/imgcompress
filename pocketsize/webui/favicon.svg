  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#5F5D5C" stroke-width="2"/>
  <!-- the picture, peeking out: a sun and a mountain -->
  <circle cx="23" cy="19" r="4.5" fill="#C2C0BF"/>
  <path d="M14 38 28 22l10 11 6-6 6 11Z" fill="#C2C0BF"/>
  <!-- the pocket -->
  <path d="M10 36h44v10a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8Z" fill="#FF3D01"/>
</svg>
