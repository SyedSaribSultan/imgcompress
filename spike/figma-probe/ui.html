<!--
  The iframe half of the Figma capability probe. This is where a ported
  web/worker.js would have to live, so this is where the interesting questions
  are: is there a WebAssembly object, will a blob-URL worker spawn with the
  manifest asking for no network at all, and can that worker reach the decode
  and encode surfaces the port depends on.

  Two deliberate absences, both of which look like sloppiness and are not:

  1. NO DESIGN SYSTEM. Every other surface in this repository renders from
     web/heyoz-tokens.css, and the standing rule is that nothing hand-types a
     colour, a corner or a duration. This file cannot import that stylesheet:
     the manifest takes exactly one UI HTML file, and the iframe is a null
     origin, so there is no relative URL to load it from. Rather than hand-copy
     values out of the token layer - which is the exact drift the rule exists to
     prevent - this page declares no colours of its own and borrows Figma's,
     which is why code.js sets themeColors: true. If those variables are ever
     absent the declarations fall back to the browser default and the report is
     still perfectly readable, which is all a diagnostic needs to be.

  2. NO TRANSITIONS AND NO ANIMATION. There is nothing here to animate, and a
     probe that is measuring memory pressure should not be spending frames.

  Everything printed by this page is ASCII, because the report is copied into
  commit messages and pasted into terminals, and a middot arriving as a
  replacement character on a Windows console defeats the point of writing it
  down.
-->
<title>imgcompress wasm probe</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    background: var(--figma-color-bg);
    color: var(--figma-color-text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.5;
  }
  p { margin: 0 0 8px; }
  #report {
    display: block;
    width: 100%;
    box-sizing: border-box;
    height: 460px;
    resize: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    white-space: pre;
  }
  #bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #status { font-variant-numeric: tabular-nums; }
</style>

<p>Reading what this iframe can actually do. Copy the report when it finishes.</p>
<textarea id="report" readonly spellcheck="false"></textarea>
<div id="bar">
  <button id="copy" type="button">Copy report</button>
  <span id="status"></span>
</div>

<script>
"use strict";

var reportEl = document.getElementById("report");
var statusEl = document.getElementById("status");

/* Lines are painted the instant they are measured and sent to code.js one at a
 * time. The expected failure mode of this whole probe is the iframe being killed
 * partway through, and a report that only exists as a variable at that moment is
 * a report nobody ever reads. */
function say(tag, text) {
  var line = "[" + tag + "] " + text;
  reportEl.value += line + "\n";
  reportEl.scrollTop = reportEl.scrollHeight;
  post({ type: "ui-line", text: line });
}

// The parent is figma.com and we are a null origin, so a specific target origin
// could never match. "*" is the documented pattern for this bridge.
function post(msg) {
  parent.postMessage({ pluginMessage: msg }, "*");
}

function describe(e) {
  if (!e) return "no error object";
  if (e.message) return e.name ? e.name + ": " + e.message : e.message;
  return String(e);
}

/* A hand-assembled 52-byte module, not a real codec.
 *
 *   (module (memory (export "mem") 1)
 *           (func (export "add") (param i32 i32) (result i32)
 *             local.get 0 local.get 1 i32.add))
 *
 * Inlining a real encoder would make the point badly: avif_enc.wasm alone is
 * 3,485,872 B and would turn a capability check into a download test. What has
 * to be proven here is that compile, instantiate, a call across the boundary and
 * a memory grow all work inside this sandbox. Those either work for 52 bytes or
 * they do not work at all. Throughput is a separate question and needs the real
 * codecs to mean anything.
 */
var WASM_B64 = "AGFzbQEAAAABBwFgAn9/AX8DAgEABQMBAAEHDQIDYWRkAAADbWVtAgAKCQEHACAAIAFqCw==";

/* The canonical SIMD feature-detect module from wasm-feature-detect: a function
 * returning v128 via i8x16.splat and i8x16.popcnt. It is only validated, never
 * instantiated, which is the cheapest honest answer. This matters because the
 * WebP build this repository ships is webp_enc_simd.wasm - without SIMD the
 * glue falls back and 345,584 B of payload buys nothing. */
var SIMD_PROBE = new Uint8Array([
  0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0,
  10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11
]);

function b64ToBytes(b64) {
  var raw = atob(b64);
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

/* ------------------------------------------------------------------------- *
 * what the iframe itself can do
 * ------------------------------------------------------------------------- */

function probeIframe() {
  say("ui", "typeof WebAssembly: " + typeof WebAssembly);
  say("ui", "typeof Worker: " + typeof Worker);
  say("ui", "typeof OffscreenCanvas: " + typeof OffscreenCanvas);
  say("ui", "typeof createImageBitmap: " + typeof createImageBitmap);
  say("ui", "typeof CompressionStream: " + typeof CompressionStream);

  // The null origin is the fact that reshapes the port: no relative fetch, no
  // relative importScripts, so every byte is inlined or comes from an absolute
  // https URL on an allowedDomains host that sends a wildcard CORS header.
  say("ui", "window.origin: " + String(window.origin));
  say("ui", "location.protocol: " + location.protocol);
  say("ui", "crossOriginIsolated: " + String(window.crossOriginIsolated));
  say("ui", "navigator.hardwareConcurrency: " + String(navigator.hardwareConcurrency));
  say("ui", "userAgent: " + navigator.userAgent);

  /* Chromium-only, and it reports the limit for the whole renderer rather than
   * for this iframe, which is exactly why it is worth printing: the number the
   * codecs have to fit inside is shared with the user's open document. Read it
   * as an upper bound on our headroom, never as our budget. */
  if (window.performance && performance.memory) {
    var m = performance.memory;
    say("ui", "performance.memory.jsHeapSizeLimit: " + m.jsHeapSizeLimit + " B");
    say("ui", "performance.memory.usedJSHeapSize at start: " + m.usedJSHeapSize + " B");
  } else {
    say("ui", "performance.memory: absent (not Chromium, or the flag is off)");
  }
}

function probeWasm() {
  if (typeof WebAssembly === "undefined") {
    say("ui", "WebAssembly is absent, so nothing below it can be tested");
    return Promise.resolve();
  }
  try {
    say("ui", "wasm SIMD: " + (WebAssembly.validate(SIMD_PROBE) ? "detected" : "NOT detected"));
  } catch (e) {
    say("ui", "wasm SIMD: could not validate the probe module - " + describe(e));
  }

  /* Threaded builds need a shared memory, and a shared memory needs cross-origin
   * isolation this iframe does not have. Printed because it decides whether a
   * multi-threaded libaom is even on the table, long before anyone measures it. */
  try {
    var shared = new WebAssembly.Memory({ initial: 1, maximum: 1, shared: true });
    var isSab = typeof SharedArrayBuffer !== "undefined" &&
      shared.buffer instanceof SharedArrayBuffer;
    say("ui", "shared wasm memory: allocated, SharedArrayBuffer=" + String(isSab));
  } catch (e) {
    say("ui", "shared wasm memory: refused - " + describe(e) +
      " (so no threaded codec build)");
  }

  return WebAssembly.instantiate(b64ToBytes(WASM_B64)).then(function (res) {
    var ex = res.instance.exports;
    var sum = ex.add(2, 3);
    say("ui", "instantiate from base64: ok, add(2,3)=" + sum +
      (sum === 5 ? "" : " WRONG, expected 5"));
    var before = ex.mem.buffer.byteLength;
    ex.mem.grow(1);
    say("ui", "wasm memory grow: " + before + " B -> " + ex.mem.buffer.byteLength + " B");
  }).catch(function (e) {
    say("ui", "instantiate from base64: FAILED - " + describe(e));
  });
}

/* canvas.toBlob asks for a format and is allowed to hand back a different one -
 * a browser with no WebP encoder silently returns PNG. So the returned MIME type
 * is the only trustworthy answer, and a size is printed alongside it because a
 * plausible type with an implausible size has fooled people before. If this
 * comes back as real WebP it is worth measuring against libwebp before paying
 * 345,584 B to ship an encoder the platform may already have. */
function probeNativeEncoders() {
  var canvas = document.createElement("canvas");
  canvas.width = 64;
  canvas.height = 64;
  var ctx = canvas.getContext("2d");
  if (!ctx) {
    say("ui", "2d canvas context: unavailable, skipping the native encoders");
    return Promise.resolve();
  }
  // A gradient rather than a flat fill: a flat fill compresses to nearly nothing
  // in every format and hides a size that would otherwise look wrong.
  var grad = ctx.createLinearGradient(0, 0, 64, 64);
  grad.addColorStop(0, "#000");
  grad.addColorStop(1, "#fff");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);

  function tryType(mime) {
    return new Promise(function (resolve) {
      try {
        canvas.toBlob(function (blob) {
          if (!blob) {
            say("ui", "canvas.toBlob(" + mime + "): returned nothing");
          } else if (blob.type !== mime) {
            say("ui", "canvas.toBlob(" + mime + "): fell back to " + blob.type +
              ", so there is no " + mime + " encoder here");
          } else {
            say("ui", "canvas.toBlob(" + mime + "): ok, " + blob.size + " B for 64x64");
          }
          resolve();
        }, mime, 0.8);
      } catch (e) {
        say("ui", "canvas.toBlob(" + mime + "): threw - " + describe(e));
        resolve();
      }
    });
  }

  return tryType("image/webp").then(function () { return tryType("image/avif"); });
}

/* ------------------------------------------------------------------------- *
 * the worker
 * ------------------------------------------------------------------------- */

/* Stringified rather than written as a template literal so that node --check
 * still parses it and an editor still highlights it. Blob-URL workers were
 * broken in Figma until Version 1 Update 76 in August 2023, so this is the one
 * capability here with a history of being false. */
function probeWorkerBody() {
  var out = [];
  function line(text) { out.push(text); }
  function why(e) {
    if (!e) return "no error object";
    if (e.message) return e.name ? e.name + ": " + e.message : e.message;
    return String(e);
  }

  line("spawned");
  line("typeof WebAssembly: " + typeof WebAssembly);
  line("typeof OffscreenCanvas: " + typeof OffscreenCanvas);
  line("typeof createImageBitmap: " + typeof createImageBitmap);
  line("typeof importScripts: " + typeof importScripts);
  line("typeof CompressionStream: " + typeof CompressionStream);

  try {
    line("wasm SIMD: " + (WebAssembly.validate(SIMD_PROBE) ? "detected" : "NOT detected"));
  } catch (e) {
    line("wasm SIMD: " + why(e));
  }

  // This is the replacement for worker.js loadCodec()'s importScripts("vendor/..."):
  // the page mints a blob URL and hands the string in, because the worker has no
  // relative path of its own to resolve against.
  try {
    importScripts(GLUE_URL);
    line("importScripts(blob: URL): " +
      (self.__probeGlue === true ? "ok, the glue ran" : "returned but set nothing"));
  } catch (e) {
    line("importScripts(blob: URL): FAILED - " + why(e));
  }

  function bytes(b64) {
    var raw = atob(b64);
    var u8 = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    return u8;
  }

  function finish() {
    self.postMessage(out);
  }

  WebAssembly.instantiate(bytes(WASM_B64)).then(function (res) {
    var sum = res.instance.exports.add(2, 3);
    line("instantiate from base64: ok, add(2,3)=" + sum);
  }).catch(function (e) {
    line("instantiate from base64: FAILED - " + why(e));
  }).then(function () {
    /* The port's real decode path in one go: encode a PNG off an OffscreenCanvas,
     * decode it back with createImageBitmap, draw it and read the pixels out.
     * Building the PNG here rather than inlining one keeps the probe small and
     * still exercises every step exportAsync bytes would take. */
    if (typeof OffscreenCanvas === "undefined") {
      line("OffscreenCanvas: absent, so the decode path cannot be tested here");
      return null;
    }
    var oc = new OffscreenCanvas(8, 8);
    var ctx = oc.getContext("2d");
    ctx.fillStyle = "rgb(10, 20, 30)";
    ctx.fillRect(0, 0, 8, 8);
    return oc.convertToBlob({ type: "image/png" }).then(function (png) {
      line("OffscreenCanvas convertToBlob png: " + png.type + ", " + png.size + " B");
      return createImageBitmap(png);
    }).then(function (bmp) {
      line("createImageBitmap: ok, " + bmp.width + "x" + bmp.height);
      var back = new OffscreenCanvas(bmp.width, bmp.height);
      var bctx = back.getContext("2d");
      bctx.drawImage(bmp, 0, 0);
      var px = bctx.getImageData(0, 0, 1, 1).data;
      line("getImageData first pixel: " + px[0] + "," + px[1] + "," + px[2] + "," + px[3] +
        (px[0] === 10 && px[1] === 20 && px[2] === 30 ? " (as drawn)" : " (NOT as drawn)"));
      return back.convertToBlob({ type: "image/webp", quality: 0.8 });
    }).then(function (webp) {
      if (!webp) return;
      line("OffscreenCanvas convertToBlob webp: " + webp.type + ", " + webp.size + " B" +
        (webp.type === "image/webp" ? "" : " - no webp encoder in this worker"));
    }).catch(function (e) {
      line("the decode/encode path broke: " + why(e));
    });
  }).then(finish, finish);
}

/* The glue stub stands in for vendor/mozjpeg.js and friends: proof that a script
 * minted on this page can be pulled into a worker, nothing more. */
var GLUE_SOURCE = "self.__probeGlue = true;\n";

function blobUrl(source) {
  return URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
}

function workerSource(glueUrl) {
  return "var WASM_B64 = " + JSON.stringify(WASM_B64) + ";\n" +
    "var GLUE_URL = " + JSON.stringify(glueUrl) + ";\n" +
    "var SIMD_PROBE = new Uint8Array(" + JSON.stringify(Array.from(SIMD_PROBE)) + ");\n" +
    "(" + probeWorkerBody.toString() + ")();\n";
}

/* Every worker check is on a timeout. A worker that never answers is a real and
 * likely outcome here - a blocked spawn under CSP looks exactly like a slow one -
 * and a probe that hangs forever reports nothing at all. */
function runWorker(kind, url, timeoutMs) {
  return new Promise(function (resolve) {
    var settled = false;
    function done() { if (!settled) { settled = true; resolve(); } }

    var timer = setTimeout(function () {
      say("worker", kind + ": no answer within " + timeoutMs + " ms");
      done();
    }, timeoutMs);

    var w;
    try {
      w = new Worker(url);
    } catch (e) {
      clearTimeout(timer);
      say("worker", kind + ": constructor threw - " + describe(e));
      done();
      return;
    }
    w.onerror = function (ev) {
      clearTimeout(timer);
      var detail = ev && ev.message ? ev.message : "no message (often a blocked script)";
      say("worker", kind + ": onerror - " + detail);
      done();
    };
    w.onmessage = function (ev) {
      clearTimeout(timer);
      var got = ev.data;
      if (Object.prototype.toString.call(got) === "[object Array]") {
        for (var i = 0; i < got.length; i++) say("worker", kind + ": " + got[i]);
      } else {
        say("worker", kind + ": " + String(got));
      }
      w.terminate();
      done();
    };
  });
}

function probeWorkers() {
  if (typeof Worker === "undefined") {
    say("ui", "Worker is absent, so the port has nowhere to put the codecs");
    return Promise.resolve();
  }
  var glue = blobUrl(GLUE_SOURCE);
  var full = workerSource(glue);
  say("ui", "worker source built: " + full.length + " chars, spawning from a blob URL");

  return runWorker("blob:", blobUrl(full), 8000).then(function () {
    /* data: URLs are the documented fallback and were fixed in the same Figma
     * update. Only the spawn is tested - if blob: works nothing needs this, and
     * if blob: is blocked this says whether there is a second door. */
    var dataUrl = "data:text/javascript;base64," +
      btoa("self.postMessage([\"spawned from a data: URL\"]);");
    return runWorker("data:", dataUrl, 8000);
  });
}

/* ------------------------------------------------------------------------- *
 * the bridge, from this side
 * ------------------------------------------------------------------------- */

/* code.js times the round trip on its own clock. This side reports only how long
 * it held the buffer, and the two numbers are never subtracted from each other:
 * the sandbox and the iframe are separate realms with separate time origins, so
 * the difference would be meaningless arithmetic that looked like a measurement. */
window.onmessage = function (event) {
  var msg = event.data && event.data.pluginMessage;
  if (!msg || typeof msg !== "object") return;

  if (msg.type === "line") {
    reportEl.value += msg.text + "\n";
    reportEl.scrollTop = reportEl.scrollHeight;
    return;
  }
  if (msg.type === "echo") {
    var t0 = performance.now();
    var bytes = msg.bytes;
    var kind = bytes instanceof Uint8Array
      ? "Uint8Array"
      : Object.prototype.toString.call(bytes);
    var len = bytes && typeof bytes.length === "number" ? bytes.length : -1;
    say("ui", "echo in: " + kind + ", " + len + " B");
    post({ type: "echo-back", size: msg.size, bytes: bytes, uiHoldMs: performance.now() - t0 });
  }
};

document.getElementById("copy").addEventListener("click", function () {
  /* Two attempts and then an honest instruction. The async clipboard needs a
   * secure context and a permission this null-origin iframe is not going to be
   * granted, and execCommand is deprecated everywhere while still being the only
   * thing that works here. Pretending a copy worked would be worse than saying
   * it did not. */
  var text = reportEl.value;
  function fallback() {
    reportEl.removeAttribute("readonly");
    reportEl.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    reportEl.setAttribute("readonly", "readonly");
    statusEl.textContent = ok
      ? "Copied."
      : "Could not copy. The text is selected - use the keyboard shortcut.";
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      statusEl.textContent = "Copied.";
    }, fallback);
  } else {
    fallback();
  }
});

/* Anything this page throws is a finding, not a crash to be hidden. Without this
 * a syntax or security error in the worker plumbing would leave a half-written
 * report and no explanation of why it stopped. */
window.onerror = function (message, source, lineno) {
  say("ui", "uncaught error: " + message + " (line " + lineno + ")");
  return false;
};

/* Said before anything else. code.js holds its own findings back until this
 * arrives, because a message sent to an iframe that has not yet installed
 * window.onmessage is dropped rather than queued. */
post({ type: "ui-ready" });

say("ui", "probe starting");
probeIframe();
probeWasm()
  .then(probeNativeEncoders)
  .then(probeWorkers)
  .catch(function (e) { say("ui", "the checks stopped early: " + describe(e)); })
  .then(function () {
    say("ui", "iframe checks done, handing over to the buffer round trip");
    post({ type: "ui-done" });
  });
</script>
