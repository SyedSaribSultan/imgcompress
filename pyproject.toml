[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsize"
version = "2.7.0"
description = "Quality-targeted image compression. Measures perceptual quality instead of guessing it, and picks the best format per image."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HeyOz" }]
keywords = [
    "image", "compression", "optimisation", "figma", "webp", "jpeg", "png",
    "ssimulacra2", "pngquant", "mozjpeg", "design",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Everything that makes the output meaningfully better. All have Windows wheels.
full = [
    "ssimulacra2>=0.3",
    "scipy>=1.10",
    "imagequant>=1.1",
    "zopflipy>=1.9",
    "mozjpeg-lossless-optimization>=1.3",
]
# A real application window instead of a browser tab.
app = ["pywebview>=4.4"]
dev = ["ruff>=0.5"]

[project.scripts]
pocketsize = "pocketsize.cli:main"
pocketsize-gui = "pocketsize.gui:main"

[project.urls]
Homepage = "https://github.com/SyedSaribSultan/pocketsize"
"Web App" = "https://pocketsize.vercel.app"
Issues = "https://github.com/SyedSaribSultan/pocketsize/issues"
Changelog = "https://github.com/SyedSaribSultan/pocketsize/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pocketsize"]

[tool.setuptools.package-data]
# The desktop app is one HTML file plus the design system it shares with the
# web app: the token layer, the face declarations and the faces themselves.
# They are copied in by tools/sync_webui_assets.py and must ship, because the
# app has to render correctly from a pip install with no network at all.
pocketsize = ["webui/*.html", "webui/*.css", "webui/fonts/*.woff2"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
